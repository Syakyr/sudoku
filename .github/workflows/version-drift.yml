name: Version drift badge

# Maintainer-facing shield for the one thing this repo's model makes easy to
# lose sight of: the deployed web app moves on every push to main, but the APK
# only moves when a tag is cut. If main drifts far from the latest tag, the
# bundled app users have installed is that many commits stale.
#
# Green  -> HEAD is the latest release
# Yellow -> a few commits ahead of the latest tag
# Red    -> main has drifted; consider cutting a release
#
# Writes a shields.io endpoint JSON back into the repo. The commit is marked
# [skip ci] and this workflow ignores its own output path, so it cannot loop.

on:
  push:
    branches: [main]
    # Cutting a release tag usually happens on a commit already on main, so
    # without also watching tags the badge keeps reporting the PREVIOUS release
    # until the next main push -- i.e. it says "+3 commits" right after you
    # shipped, which is exactly the signal it exists to give.
    tags: ['v*']
    paths-ignore:
      - '.github/badges/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to compute drift; the default shallow clone has none.
          fetch-depth: 0

      - name: Work on main, not whatever triggered this
        # A tag push checks out the tag in detached HEAD, where `git push` has
        # no upstream and the commit step would fail. And if a tag is ever cut
        # on an older commit, pushing that HEAD to main would move main
        # backwards. So pin to origin/main first: the badge describes main,
        # no matter which ref fired the workflow.
        run: git checkout -B main origin/main

      - name: Compute drift since the latest release tag
        run: |
          LATEST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          if [ -z "$LATEST" ]; then
            AHEAD=0
            MSG='no release yet'
            COLOR='red'
          else
            AHEAD="$(git rev-list --count "${LATEST}..HEAD")"
            if [ "$AHEAD" -eq 0 ]; then
              MSG="$LATEST · shipped"
              COLOR='green'
            elif [ "$AHEAD" -le 4 ]; then
              MSG="$LATEST · +$AHEAD commits"
              COLOR='yellow'
            else
              MSG="$LATEST · +$AHEAD commits"
              COLOR='red'
            fi
          fi

          echo "latest tag: ${LATEST:-none}, commits since: $AHEAD"

          mkdir -p .github/badges
          node -e '
            const fs = require("fs");
            const [message, color] = process.argv.slice(1);
            fs.writeFileSync(
              ".github/badges/version-drift.json",
              JSON.stringify({
                schemaVersion: 1,
                label: "bundled APK",
                message,
                color,
              }) + "\n",
            );
          ' "$MSG" "$COLOR"

          cat .github/badges/version-drift.json

      - name: Commit the badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage FIRST, then compare the index. `git diff --quiet -- <path>`
          # only looks at tracked content, so on the very first run -- when the
          # badge file is brand new and untracked -- it reported "unchanged"
          # and the workflow exited green without ever committing. A check that
          # cannot fail is worse than no check: it looked like the badge was
          # working while raw.githubusercontent served a 404.
          git add .github/badges/version-drift.json
          if git diff --cached --quiet -- .github/badges/version-drift.json; then
            echo "Badge unchanged."
            exit 0
          fi
          git commit -m "chore: update version drift badge [skip ci]"
          git push
