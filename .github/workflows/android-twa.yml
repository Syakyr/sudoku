name: Android TWA release

# Wraps the PWA in a Trusted Web Activity and publishes the signed APK as a
# GitHub Release asset, which is what Obtainium tracks.
#
# PREREQUISITES -- this job fails loudly rather than silently producing a
# throwaway build, because a rotating signing key makes every later release
# uninstallable over the previous one:
#
#   secrets.TWA_KEYSTORE_BASE64    the signing keystore, base64 (see
#                                 tools/make-twa-keystore.sh)
#   secrets.TWA_KEYSTORE_PASSWORD  store password
#   secrets.TWA_KEY_PASSWORD       key password
#   android/                       the Bubblewrap project, generated ONCE by
#                                 `bubblewrap init` and committed. `init` is
#                                 interactive, so it cannot run in CI.
#
# And separately, outside this repo: Digital Asset Links must be reachable at
# https://syakyr.github.io/.well-known/assetlinks.json -- the ORIGIN ROOT,
# not /sudoku/. Without it the APK still installs and runs, but falls back to
# a Chrome Custom Tab with browser UI instead of a trusted full-screen app.
# See ANDROID-TWA.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true
        type: string

# Needed to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Bubblewrap needs a JDK and the Android SDK. setup-android installs the
      # command-line tools, build-tools and a platform, and exports ANDROID_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted ubuntu runners ship the Android SDK pre-installed, so no
      # setup action is used. android-actions/setup-android@v3 was tried and
      # fails on today's SDK repo: it still tries to install the legacy `tools`
      # package, which Google removed --
      #   Warning: Failed to find package 'tools'
      #   Error: ... sdkmanager failed with exit code 1
      # THE ACTUAL BLOCKER, read out of bubblewrap 1.27.0 rather than guessed.
      # core/lib/androidSdk/AndroidSdkTools.js:
      #
      #   static async validatePath(sdkPath) {
      #     const toolsPath = path.join(sdkPath, 'tools');
      #     const binPath = path.join(sdkPath, 'bin');
      #     if (!fs.existsSync(sdkPath) || (!fs.existsSync(toolsPath)) && !fs.existsSync(binPath)) {
      #       return Result.error(new ValidatePathError('The provided androidSdk isn\'t correct.',
      #                                              'PathIsNotCorrect'));
      #
      # i.e. the SDK ROOT is accepted only if it contains `tools/` (the legacy
      # layout) or `bin/` (the layout used once cmdline-tools >= 6858069 is
      # unzipped at the root). Runner images ship cmdline-tools at
      # $SDK/cmdline-tools/latest and have neither, so the check fails with
      # "The provided androidSdk isn't correct." even though build-tools and
      # platforms are all present -- which is exactly what the log showed.
      #
      # Expose the new-layout `bin` at the SDK root. Verified usable via
      # `sdkmanager --version` below, so if the symlinked launcher ever fails to
      # resolve its own APP_HOME we find out here instead of mid-build.
      - name: Point at the pre-installed Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK at $SDK"
            ls -la /usr/local/lib/android 2>/dev/null || echo "  (nothing under /usr/local/lib/android)"
            exit 1
          fi

          if [ ! -e "$SDK/bin" ] && [ ! -e "$SDK/tools" ]; then
            if [ -w "$SDK" ]; then
              ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
            else
              sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
            fi
            echo "Linked $SDK/bin -> $SDK/cmdline-tools/latest/bin"
          else
            echo "$SDK already has $( [ -e "$SDK/bin" ] && echo bin || echo tools )"
          fi

          echo "sdkmanager: $("$SDK/bin/sdkmanager" --version)"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "cmdline-tools: $(ls "$SDK/cmdline-tools" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools:   $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "platforms:     $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # bubblewrap shells out to ONE exact build-tools version, hard-coded as
      # BUILD_TOOLS_VERSION in @bubblewrap/core. `build` calls checkBuildTools()
      # and, if it is missing, installBuildTools() -- which resolves sdkmanager at
      # $SDK/tools/bin/sdkmanager first and only then $SDK/bin/sdkmanager. Read
      # the constant from the installed package instead of hard-coding it here, so
      # a bubblewrap bump cannot silently desync this workflow from it.
      # (Measured 2026-10-10: the runner already carries 36.1.0, so this step is
      # insurance against a future image, not the current fix.)
      - name: Ensure the build-tools bubblewrap requires
        run: |
          REQUIRED=$(NODE_PATH="$(npm root -g)" node -e \
            'console.log(require("@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js").BUILD_TOOLS_VERSION)')
          echo "bubblewrap requires build-tools;$REQUIRED"
          if [ -d "$ANDROID_HOME/build-tools/$REQUIRED" ]; then
            echo "Already present."
          else
            echo "Installing via sdkmanager..."
            yes | "$ANDROID_HOME/bin/sdkmanager" --install "build-tools;$REQUIRED" --sdk_root="$ANDROID_HOME"
            test -d "$ANDROID_HOME/build-tools/$REQUIRED"
          fi

      - name: Check the generated project is committed
        run: |
          if [ ! -f android/twa-manifest.json ]; then
            echo "::error::android/twa-manifest.json not found. Run \`bubblewrap init\` once"
            echo "  (it is interactive, so not runnable in CI) and commit the android/ directory."
            echo "  See ANDROID-TWA.md."
            exit 1
          fi

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::TWA_KEYSTORE_BASE64 is not set. Generate a keystore with"
            echo "  tools/make-twa-keystore.sh and store it, with its passwords, as repo secrets."
            echo "  Do NOT let CI generate a fresh key per build: Android refuses to update an"
            echo "  app when the signing certificate changes, so every release would be a"
            echo "  clean-install-only app and Obtainium updates would break."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/twa.keystore"
          test -s "$RUNNER_TEMP/twa.keystore"

      # bubblewrap keeps its own config (jdkPath / androidSdkPath) at
      # ~/.bubblewrap/config.json and PROMPTS for it when unset -- including in
      # `update`, which is not non-interactive the way the docs read. Measured:
      #   ? Do you want Bubblewrap to install the JDK (recommended)? (Y/n)
      #   ##[error]Process completed with exit code 130
      # Seed it from the actions/setup-java and runner-provided SDK paths.
      - name: Seed bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      # versionCode must INCREASE across releases or Android refuses to update an
      # existing install in place (and Obtainium stops offering the app). The old
      # step let `bubblewrap update` compute it, which is
      #   appVersionCode = <value committed in twa-manifest.json> + 1
      # (shared.js updateVersions) -- and CI never commits the bumped manifest
      # back, so every release would have shipped the same versionCode 2 and the
      # second install-over would have failed. Derive it from the tag instead:
      # monotonic for as long as the tags are monotonic.
      - name: Stamp the app version from the tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # NB: the pre-release suffix is ignored by the derivation, so
          # `v1.0.0-rc` and `v1.0.0` map to the SAME versionCode. Do not ship
          # both -- the second is not an upgrade. The resolved code is echoed
          # below; check it before trusting a release.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH -- cannot derive a monotonic versionCode."
            exit 1
          fi
          CODE=$(printf '%s' "${TAG#v}" | awk -F'[.-]' '{printf "%d%03d%03d", $1, $2, $3}')
          echo "tag=$TAG -> versionCode=$CODE versionName=$TAG"
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.appVersionCode = Number(process.argv[2]);
            manifest.appVersionName = process.argv[3];
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' android/twa-manifest.json "$CODE" "$TAG"

      # --directory is REQUIRED and was the second latent bug. In cmds/update.js
      # `targetDirectory = args.directory`, and updateProject() falls back to
      # process.cwd() when it is undefined -- so the previous invocation
      # regenerated the ENTIRE Android project into the repo root next to
      # index.html (the log said "Generating Android Project." and passed), and
      # wrote manifest-checksum.txt there too. The committed android/ tree was
      # never the thing being built.
      #
      # --skipVersionUpgrade because the version was stamped above: with it set,
      # updateProject() skips updateVersions() AND skips saveToFile(), so the
      # generated Gradle project uses exactly the values we just wrote and the
      # on-disk manifest (hence the checksum `build` compares against) is left
      # consistent.
      - name: Sync the project with the web manifest
        run: |
          bubblewrap update \
            --directory=android \
            --manifest=android/twa-manifest.json \
            --skipVersionUpgrade

      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        working-directory: android
        run: |
          # Run INSIDE the project directory. GradleWrapper is constructed as
          # `new GradleWrapper(process, androidSdkTools)` in cmds/build.js -- no
          # projectLocation argument -- so `projectLocation = process.cwd()` and
          # gradlew is always executed in the current directory regardless of
          # --directory. `--manifest` is a FILE path here too (build.js:
          # `TwaManifest.fromFile(this.args.manifest)`), not a directory as the
          # old comment claimed; `--manifest=android` would have thrown EISDIR
          # the moment the SDK check stopped failing first.
          #
          # --skipPwaValidation was dropped: minimist accepts any flag, but
          # nothing in cmds/build.js ever reads it in 1.27.0 -- PWA quality
          # validation is a separate `bubblewrap validate` command. It was a
          # no-op dressed up as a workaround.
          #
          # --signingKeyAlias is pinned because the generated twa-manifest.json
          # carries alias "android" (bubblewrap's own default from the key it
          # minted during init), but the key stored in TWA_KEYSTORE_BASE64 was
          # created with alias "sudoku-twa". Without this the build looks for an
          # alias that does not exist in the secret keystore and fails.
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath "$RUNNER_TEMP/twa.keystore" \
            --signingKeyAlias sudoku-twa

      - name: Record the signing certificate fingerprint
        # Needed for .well-known/assetlinks.json. Printed into the log rather
        # than the repo, since it is derived from a secret you control.
        env:
          STOREPASS: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
        run: |
          echo "=== SHA-256 certificate fingerprint (for assetlinks.json) ==="
          keytool -list -rfc -keystore "$RUNNER_TEMP/twa.keystore" \
            -storepass:env STOREPASS 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256 | sed 's/^.*=//'
          echo "=============================================================="

      - name: Stage the assets
        run: |
          # Output paths are relative to the project directory (cmds/build.js:
          # APK_SIGNED_FILE_NAME = './app-release-signed.apk', cwd = android/).
          mkdir -p out
          TAG="${{ steps.tag.outputs.tag }}"
          cp android/app-release-signed.apk "out/sudoku-twa-$TAG.apk"
          # The AAB is only useful if you ever go to Play Store; harmless to ship.
          if [ -f android/app-release-bundle.aab ]; then
            cp android/app-release-bundle.aab "out/sudoku-twa-$TAG.aab"
          fi
          ls -la out/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "Sudoku TWA $TAG" \
              --notes-file "$GITHUB_WORKSPACE/.github/twa-release-notes.md" \
              || gh release create "$TAG" out/* --title "Sudoku TWA $TAG"
          fi
          echo
          echo "Obtainium: add this repo and point it at the latest release APK asset"
          gh release view "$TAG" --json assets --jq '.assets[].name'
