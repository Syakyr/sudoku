name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The app is a static bundle: index.html + css/ + js/, all referenced by
      # relative path, so it works at a project-page subpath with no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          ignore: |
            **/node_modules/**
            .git
            .github
            tests
            package.json
            package-lock.json

      - id: deployment
        uses: actions/deploy-pages@v4
