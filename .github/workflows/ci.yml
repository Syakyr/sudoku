name: CI

on:
  # Branch pushes and PRs only. A bare `push:` here also fires on tag pushes,
  # which made a release tag run the test suite twice -- once from this
  # workflow, and again from android-apk.yml's own test job that gates the
  # build. Splitting the triggers means:
  #   push to main / PR  -> CI tests only
  #   tag v*             -> android-apk.yml tests, then builds and releases
  # so no event runs the same suite twice.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept identical to android-apk.yml on purpose: host, test CI and the
          # release build all on the same toolchain, so "works locally" and
          # "works in CI" cannot disagree about the Node major.
          node-version: '26.11.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

# No `pages` job here, deliberately. This site uses GitHub Pages' legacy
# branch-based deployment (build_type: legacy, source main /), which publishes
# the branch directly via the separate `pages-build-deployment` workflow. The
# actions/deploy-pages flow only works when the site's build type is set to
# "GitHub Actions", so a deploy job here would fail against a legacy site, and
# switching the type would break the working branch-based publish. CI's only job
# is to run the tests.
