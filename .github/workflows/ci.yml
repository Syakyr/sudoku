name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

# No `pages` job here, deliberately. This site uses GitHub Pages' legacy
# branch-based deployment (build_type: legacy, source main /), which publishes
# the branch directly via the separate `pages-build-deployment` workflow. The
# actions/deploy-pages flow only works when the site's build type is set to
# "GitHub Actions", so a deploy job here would fail against a legacy site, and
# switching the type would break the working branch-based publish. CI's only job
# is to run the tests.
